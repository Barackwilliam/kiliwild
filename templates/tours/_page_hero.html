{% comment %}Inner-page hero. Pass: image (URL), title, lead, crumbs (optional label), tall (bool).{% endcomment %}
<section class="page-hero{% if tall %} page-hero-tall{% endif %}">
  {% if image %}<div class="page-hero-bg" aria-hidden="true"><img src="{{ image }}" alt="" fetchpriority="high" decoding="async"></div>{% endif %}
  <div class="container">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="{% url 'tours:home' %}">Home</a> <span>/</span> {{ crumb|default:title }}</nav>
    {% if eyebrow %}<p class="eyebrow eyebrow-light">{{ eyebrow }}</p>{% endif %}
    <h1>{{ title }}</h1>
    {% if lead %}<p class="lead">{{ lead }}</p>{% endif %}
  </div>
</section>
