      <path d="M200 140 C260 150 280 220 250 280 C220 330 150 330 130 270 C110 210 140 135 200 140Z" stroke-opacity=".34"/>

  <div class="topo-orb o1" aria-hidden="true"><img src="{% static 'img/map/meru.jpg' %}" alt="" decoding="async"></div>
  <div class="topo-orb o2" aria-hidden="true"><img src="{% static 'img/wild/twiga.jpg' %}" alt="" decoding="async"></div>
  <div class="topo-orb o3" aria-hidden="true"><img src="{% static 'img/zones/moorland.jpg' %}" alt="" decoding="async"></div>
  <div class="container topo-copy">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="{% url 'tours:home' %}">Home</a> <span>/</span> Mount Meru</nav>
    <span class="hand">Mlima Meru</span>
    <h1>Every line leads to <em>Socialist Peak</em></h1>
    <p>{{ info.intro }}</p>
    <div class="xh-actions">
      <a class="btn btn-gold btn-lg" href="#trips">See the treks {% include "tours/_icon.html" with name="arrow" %}</a>
      <a class="btn btn-ghost btn-lg" href="{% url 'tours:category' 'combo' %}">Meru + Kili combo</a>
    </div>
  </div>
</section>
